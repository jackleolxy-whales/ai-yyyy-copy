<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剧集解说 - 批量上传与分析</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <style>
    body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #e8e8e8; }
    .card { border: 1px solid rgba(138,43,226,0.2); border-radius: 16px; backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(22,22,35,0.95) 0%, rgba(28,28,45,0.9) 100%); }
    .btn-primary { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); border: 1px solid rgba(139,92,246,0.3); }
    .form-control { background: rgba(30,30,45,0.8); border: 1px solid rgba(138,43,226,0.2); color: #f3f4f6; }
    .result-card { border: 1px solid rgba(255,255,255,0.1); border-left: 4px solid; border-image: linear-gradient(45deg,#ff006e,#8338ec,#3a86ff,#06c,#ffbe0b) 1; }
    pre { color: #fff; background: transparent; border: none; white-space: pre-wrap; }
    .result-card table { width: 100%; border-collapse: collapse; color: #fff; }
    .result-card th, .result-card td { border: 1px solid rgba(255,255,255,0.1); padding: 8px; color: #fff; }
    .result-card tr:nth-child(even) { background: rgba(255,255,255,0.03); }
    .md-view { color: #e8e8e8; }
    .result-card .table {
      --bs-table-color: #ffffff;
      --bs-table-bg: transparent;
      --bs-table-border-color: rgba(255,255,255,0.1);
      --bs-table-striped-bg: rgba(255,255,255,0.06);
      --bs-table-striped-color: #ffffff;
      --bs-table-hover-bg: rgba(255,255,255,0.08);
      --bs-table-hover-color: #ffffff;
    }
    .result-card .table th, .result-card .table td { color: #ffffff; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="mb-4">
      <h2 class="fw-bold" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">剧集解说（批量）</h2>
      <p class="text-muted">批量上传本地视频，每个视频分别调用 LaoZhang 模型进行解说生成</p>
      <a href="/" class="btn btn-sm btn-outline-light"><i class="fa fa-home me-1"></i>返回首页</a>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <form id="episodeForm">
          <div class="mb-3">
            <label class="form-label">选择视频（可多选）</label>
            <input class="form-control" type="file" id="episodeFiles" name="episode_files" multiple accept="video/*">
            <div class="form-text">支持 mp4/avi/mov/wmv/flv/webm/mkv 等格式</div>
          </div>
          <div class="mb-3">
            <label class="form-label">生成要求（提示词）</label>
            <textarea class="form-control" id="userPrompt" rows="12">Role: You are a relatable, high-energy American girl acting as the user's "bestie." You are watching a dramatic short drama and summarizing it for your friend. You specialize in "spilling the tea" (sharing gossip) with a very casual, American local tone.

Task: I will provide you with the plot of a single episode and the total duration. Your goal is to generate a synchronized voiceover script that sounds like a natural, unscripted conversation between close friends.

Input Data:

Video

Strict Requirements:

Tone & Language (Crucial):

Style: Casual, conversational, and "gossipy." Use native American colloquialisms and daily spoken language.

Vibe: Imagine you are FaceTiming your best friend. Use phrases like "Girl, you won't believe this," "Literally," "Major red flag," "He has the audacity," "I'm shook," etc.

Avoid: Formal writing, robotic narration, or complex sentence structures. Keep it punchy and relatable.

Timing & Synchronization:

Target pace: 140-150 words per minute.

Assumed Frame Rate: 30 FPS.

The script must cover the full video duration without dead air.

Formatting:

Time Stamp Format: MM:SS:FF - MM:SS:FF (Minutes:Seconds:Frames).

Frame count (FF) must be between 00-29.

Output Format:

You must output ONLY a table with two columns: [Time Stamp (MM:SS:FF)] and [Narration Line].

DO NOT write any introductory text, explanations, notes, or concluding remarks.

DO NOT include word counts.

Start directly with the markdown table.

Objective: Turn the plot into a juicy, engaging story that fits perfectly within the timestamps, using slang and a "best friend" persona.</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">模型（可选）</label>
            <select class="form-select" id="modelSelect">
              <option value="">默认（gemini-2.5-pro）</option>
              <option value="gemini-2.5-pro" selected>gemini-2.5-pro</option>
              <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn"><i class="fa fa-upload me-1"></i>开始上传并分析</button>
        </form>
      </div>
    </div>

    <div id="statusBox" class="alert alert-info d-none"></div>

    <div id="results" class="mt-3"></div>
  </div>

  <script>
    const formEl = document.getElementById('episodeForm');
    const filesEl = document.getElementById('episodeFiles');
    const promptEl = document.getElementById('userPrompt');
    const modelEl = document.getElementById('modelSelect');
    const statusEl = document.getElementById('statusBox');
    const resultsEl = document.getElementById('results');
    const btnEl = document.getElementById('submitBtn');

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const files = filesEl.files;
      const prompt = (promptEl.value || '').trim();
      const model = (modelEl.value || '').trim();
      if (!files || files.length === 0) {
        alert('请至少选择一个视频文件');
        return;
      }
      btnEl.disabled = true;
      statusEl.classList.remove('d-none');
      statusEl.textContent = '正在上传并分析...';
      try {
        const fd = new FormData();
        for (let i = 0; i < files.length; i++) fd.append('episode_files', files[i]);
        fd.append('user_prompt', prompt);
        if (model) fd.append('model', model);
        const resp = await fetch('/episode/narration/upload_batch', { method: 'POST', body: fd });
        const data = await resp.json();
        if (!data.success) throw new Error(data.error || '上传分析失败');
        statusEl.textContent = `已开始处理，批次ID：${data.batch_id}，共 ${data.total_count} 个文件`;
        initProgressCards(files);
        window.currentBatchId = data.batch_id;
        startPolling(data.batch_id);
      } catch (err) {
        statusEl.classList.replace('alert-info', 'alert-danger');
        statusEl.textContent = `错误：${err.message}`;
      } finally {
        btnEl.disabled = false;
      }
    });

    function renderResults(items) {
      resultsEl.innerHTML = '';
      if (!items || !items.length) return;
      items.forEach((it, idx) => {
        const card = document.createElement('div');
        card.className = 'card result-card mb-3';
        const body = document.createElement('div');
        body.className = 'card-body';
        const title = document.createElement('h6');
        title.textContent = `视频 ${idx + 1}：${it.filename || ''}`;
        const status = document.createElement('div');
        status.className = 'text-muted mb-2';
        status.textContent = it.success ? '分析成功' : '分析失败';
        const meta = document.createElement('div');
        meta.className = 'text-muted';
        if (it.model || it.duration_ms != null) {
          const ms = it.duration_ms != null ? `${Math.round(it.duration_ms/1000)}s` : '';
          meta.textContent = `${it.model || ''}${it.model && ms ? ' · ' : ''}${ms}`;
        }
        body.appendChild(title);
        body.appendChild(status);
        body.appendChild(meta);
        const md = document.createElement('div');
        md.className = 'md-view';
        const raw = it.success ? (it.result || '') : (it.error || '未知错误');
        try {
          const html = DOMPurify.sanitize(marked.parse(raw));
          md.innerHTML = html;
          styleTables(md);
        } catch (e) {
          const pre = document.createElement('pre');
          pre.textContent = raw;
          md.appendChild(pre);
        }
        body.appendChild(md);
        const actions = document.createElement('div');
        actions.className = 'mt-2';
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'btn btn-sm btn-outline-light';
        copyBtn.textContent = '复制 Markdown';
        copyBtn.onclick = async () => { await copyText(raw); flashCopied(copyBtn); };
        actions.appendChild(copyBtn);
        body.appendChild(actions);
        card.appendChild(body);
        resultsEl.appendChild(card);
      });
    }

    const cards = new Map();
    function initProgressCards(files) {
      resultsEl.innerHTML = '';
      cards.clear();
      for (let i = 0; i < files.length; i++) {
        const fname = files[i].name;
        const card = document.createElement('div');
        card.className = 'card result-card mb-3';
        const body = document.createElement('div');
        body.className = 'card-body';
        const title = document.createElement('h6');
        title.textContent = `视频 ${i + 1}：${fname}`;
        const st = document.createElement('div');
        st.className = 'text-muted mb-2';
        st.textContent = '等待中';
        const meta = document.createElement('div');
        meta.className = 'text-muted';
        const progress = document.createElement('div');
        progress.className = 'progress';
        const bar = document.createElement('div');
        bar.className = 'progress-bar';
        bar.style.width = '0%';
        progress.appendChild(bar);
        const md = document.createElement('div');
        md.className = 'md-view';
        body.appendChild(title);
        body.appendChild(st);
        body.appendChild(meta);
        body.appendChild(progress);
        body.appendChild(md);
        card.appendChild(body);
        resultsEl.appendChild(card);
        const actions = document.createElement('div');
        actions.className = 'mt-2';
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'btn btn-sm btn-outline-light';
        copyBtn.textContent = '复制 Markdown';
        copyBtn.disabled = true;
        copyBtn.onclick = async () => { const ref = cards.get(i); if (ref && ref.raw) { await copyText(ref.raw); flashCopied(copyBtn); } };
        const retryBtn = document.createElement('button');
        retryBtn.type = 'button';
        retryBtn.className = 'btn btn-sm btn-outline-warning ms-2';
        retryBtn.textContent = '失败重试';
        retryBtn.disabled = true;
        retryBtn.onclick = async () => { const ref = cards.get(i); if (!window.currentBatchId) return; await retryItem(window.currentBatchId, i, ref); };
        actions.appendChild(copyBtn);
        actions.appendChild(retryBtn);
        body.appendChild(actions);
        cards.set(i, { card, title, st, meta, bar, md, fname, copyBtn, retryBtn, raw: null, model: null, duration_ms: null });
      }
    }

    let pollTimer = null;
    async function startPolling(batchId) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const r = await fetch(`/episode/narration/batch/status/${batchId}`);
          const s = await r.json();
          if (!s.success) return;
          const status = s.status || {};
          const items = status.items || [];
          items.forEach((it) => {
            const ref = cards.get(it.index);
            if (!ref) return;
            if (it.status === 'queued') {
              ref.st.textContent = '等待中';
              ref.bar.style.width = '0%';
            } else if (it.status === 'processing') {
              ref.st.textContent = '处理中';
              ref.bar.style.width = '50%';
            } else if (it.status === 'done') {
              ref.st.textContent = '分析成功';
              ref.bar.style.width = '100%';
            } else if (it.status === 'failed') {
              ref.st.textContent = '分析失败';
              ref.bar.style.width = '100%';
              if (ref.retryBtn) ref.retryBtn.disabled = false;
            }
          });
          if (status.status === 'completed') {
            const rr = await fetch(`/episode/narration/batch/result/${batchId}`);
            const data = await rr.json();
            if (data.success && Array.isArray(data.results)) {
              data.results.forEach((it) => {
                const ref = cards.get(it.index);
                if (!ref) return;
                const raw = it.success ? (it.result || '') : (it.error || '未知错误');
                try {
                  const html = DOMPurify.sanitize(marked.parse(raw));
                  ref.md.innerHTML = html;
                  styleTables(ref.md);
                  ref.raw = raw;
                  if (ref.copyBtn) ref.copyBtn.disabled = false;
                } catch (e) {
                  ref.md.textContent = raw;
                  ref.raw = raw;
                  if (ref.copyBtn) ref.copyBtn.disabled = false;
                }
                ref.model = it.model || null;
                ref.duration_ms = it.duration_ms != null ? it.duration_ms : null;
                if (ref.meta) {
                  const ms = ref.duration_ms != null ? `${Math.round(ref.duration_ms/1000)}s` : '';
                  ref.meta.textContent = `${ref.model || ''}${ref.model && ms ? ' · ' : ''}${ms}`;
                }
                if (ref.retryBtn) ref.retryBtn.disabled = it.success;
              });
            }
            clearInterval(pollTimer);
            statusEl.textContent = `处理完成，批次ID：${batchId}，共 ${status.total || cards.size} 个文件`;
          }
        } catch (e) {}
      }, 1000);
    }

    function styleTables(root) {
      const tables = root.querySelectorAll('table');
      tables.forEach(t => {
        t.classList.add('table', 'table-striped', 'table-bordered');
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    function flashCopied(btn) {
      const old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = old; }, 1500);
    }

    async function retryItem(batchId, index, ref) {
      try {
        if (!ref) return;
        ref.st.textContent = '处理中';
        ref.bar.style.width = '50%';
        const resp = await fetch('/episode/narration/retry_one', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ batch_id: batchId, index })
        });
        const data = await resp.json();
        if (data.success && data.result) {
          const it = data.result;
          const raw = it.result || '';
          try {
            const html = DOMPurify.sanitize(marked.parse(raw));
            ref.md.innerHTML = html;
            styleTables(ref.md);
            ref.raw = raw;
          } catch (e) {
            ref.md.textContent = raw;
            ref.raw = raw;
          }
          ref.model = it.model || null;
          ref.duration_ms = it.duration_ms != null ? it.duration_ms : null;
          if (ref.meta) {
            const ms = ref.duration_ms != null ? `${Math.round(ref.duration_ms/1000)}s` : '';
            ref.meta.textContent = `${ref.model || ''}${ref.model && ms ? ' · ' : ''}${ms}`;
          }
          ref.st.textContent = '分析成功';
          ref.bar.style.width = '100%';
          if (ref.copyBtn) ref.copyBtn.disabled = false;
          if (ref.retryBtn) ref.retryBtn.disabled = true;
        } else {
          ref.st.textContent = '分析失败';
          ref.bar.style.width = '100%';
          if (ref.retryBtn) ref.retryBtn.disabled = false;
        }
      } catch (e) {
        ref.st.textContent = '分析失败';
        ref.bar.style.width = '100%';
        if (ref.retryBtn) ref.retryBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
